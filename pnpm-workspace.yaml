allowBuilds:
  esbuild: true
  sharp: true
  vue-demi: true

# Nuxt resolves these type aliases from the project root.
publicHoistPattern:
  - '@vue/*'
  - defu
  - consola

# Preserve these existing Yarn resolutions despite pnpm's 24-hour release delay.
minimumReleaseAgeExclude:
  - '@devframes/agentic@1.3.5'
  - '@vue/test-utils@2.6.0'
  - 'devframe@1.3.5'
  # Pinned Video.js migration packages verified against their current official docs.
  - '@videojs/core@10.5.0'
  - '@videojs/element@10.5.0'
  - '@videojs/html@10.5.0'
  - '@videojs/media@10.5.0'
  - '@videojs/native-hls-video@10.5.0'
  - '@videojs/spf@10.5.0'
  - '@videojs/store@10.5.0'
  - '@videojs/utils@10.5.0'
  - video.js@10.5.0
