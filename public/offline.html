<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#211712">
    <meta name="color-scheme" content="dark light">
    <title>Offline · DM Vault</title>
    <style>
      :root { color-scheme: dark; font: 1.125rem/1.6 Georgia, serif; color: #ece2d2; background: #211712; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 1.5rem; }
      main { max-width: 28rem; }
      h1 { font-size: 1.75rem; line-height: 1.25; }
      a { color: #f5d27a; display: inline-block; padding: .75rem 0; text-underline-offset: .25rem; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; color: #3a3020; background: #f5efe4; }
        a { color: #7a4f13; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa-192.png" alt="" width="80" height="80">
      <p>DM Vault</p>
      <h1>You're offline</h1>
      <p>Reconnect to open your campaigns and play recordings or recaps. Private pages and media aren't stored for offline use.</p>
      <a href="/">Try opening DM Vault again</a>
    </main>
  </body>
</html>
